name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: winddesk-local-test-only
          POSTGRES_DB: winddesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: npm ci --no-fund --no-audit
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m pytest tests/test_auth.py
        env:
          POSTGRES_TEST_URL: postgresql://postgres:winddesk-local-test-only@127.0.0.1:5432/winddesk_test
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: |
          python -m uvicorn backend.app:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          node scripts/performance.mjs --runs 1 --output test-results/performance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-and-performance-evidence
          path: test-results/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t winddesk:test .
      - run: |
          docker run -d --name winddesk -p 8000:8000 winddesk:test
          for i in $(seq 1 30); do
            if curl --fail http://localhost:8000/api/health; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8000/api/health
          curl --fail http://localhost:8000/ > /dev/null
          docker logs winddesk
